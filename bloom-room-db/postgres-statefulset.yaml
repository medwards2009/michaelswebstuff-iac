apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bloom-room-postgres
  namespace: bloom-room-db
spec:
  serviceName: bloom-room-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bloom-room-postgres
  template:
    metadata:
      labels:
        app: bloom-room-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bloom
            - name: POSTGRES_DB
              value: bloom_room
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bloom-room-db-secrets
                  key: DB_PASSWORD
            # Point PGDATA at a subdirectory of the mounted volume. The PVC's
            # mount root contains a lost+found directory, and Postgres refuses to
            # initialise into a non-empty directory. Initialising into a fresh
            # subdirectory sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bloom
                - -d
                - bloom_room
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
